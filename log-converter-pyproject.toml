[project]
name = "imc-log-converter"
version = "1.0.0"
description = "Convert IMC Prosperity JSON logs to CSV format"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["imc", "prosperity", "log", "converter", "csv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pandas>=1.3.0",
]

[project.scripts]
log-converter = "log_converter.__main__:main"

[project.urls]
Homepage = "https://github.com/yourusername/log-converter"
Repository = "https://github.com/yourusername/log-converter"
Issues = "https://github.com/yourusername/log-converter/issues"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
