<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prosperity Visualizer - Local Clone</title>
    <base href="./" />
    <script>
      (function () {
        const telemetryHosts = new Set([
          "app.posthog.com",
          "us.i.posthog.com",
          "us.posthog.com",
          "sentry.io",
          "o450.ingest.sentry.io",
        ]);
        const blockedPostHosts = new Set(["api.prosperity.equirag.com"]);

        function parseUrl(target) {
          try {
            return new URL(target, window.location.href);
          } catch {
            return null;
          }
        }

        function shouldBlockRequest(target, method) {
          const parsed = parseUrl(target);
          if (!parsed) return false;

          if (telemetryHosts.has(parsed.hostname)) {
            return true;
          }

          const normalizedMethod = String(method || "GET").toUpperCase();
          if (blockedPostHosts.has(parsed.hostname) && normalizedMethod !== "GET" && normalizedMethod !== "HEAD") {
            return true;
          }

          return false;
        }

        const originalFetch = window.fetch ? window.fetch.bind(window) : null;
        if (originalFetch) {
          window.fetch = function (input, init) {
            const url = typeof input === "string" ? input : input && input.url;
            const method =
              (init && init.method) ||
              (typeof Request !== "undefined" && input instanceof Request ? input.method : "GET");

            if (url && shouldBlockRequest(url, method)) {
              return Promise.resolve(
                new Response(
                  JSON.stringify({
                    blocked: true,
                    localClone: true,
                    message: "Outbound request blocked in local clone.",
                  }),
                  {
                    status: 200,
                    headers: { "Content-Type": "application/json" },
                  },
                ),
              );
            }

            return originalFetch(input, init);
          };
        }

        const originalBeacon = navigator.sendBeacon ? navigator.sendBeacon.bind(navigator) : null;
        if (originalBeacon) {
          navigator.sendBeacon = function (url, data) {
            if (shouldBlockRequest(url, "POST")) {
              return true;
            }
            return originalBeacon(url, data);
          };
        }

        const OriginalXHR = window.XMLHttpRequest;
        if (OriginalXHR) {
          function LocalCloneXHR() {
            const xhr = new OriginalXHR();
            let blocked = false;
            let blockedUrl = "";

            const originalOpen = xhr.open;
            xhr.open = function (method, url) {
              blocked = shouldBlockRequest(url, method);
              blockedUrl = url || "";
              if (!blocked) {
                return originalOpen.apply(xhr, arguments);
              }
              return undefined;
            };

            const originalSend = xhr.send;
            xhr.send = function () {
              if (!blocked) {
                return originalSend.apply(xhr, arguments);
              }

              Object.defineProperty(xhr, "readyState", { configurable: true, value: 4 });
              Object.defineProperty(xhr, "status", { configurable: true, value: 200 });
              Object.defineProperty(xhr, "responseText", {
                configurable: true,
                value: JSON.stringify({
                  blocked: true,
                  localClone: true,
                  url: blockedUrl,
                  message: "Outbound XHR blocked in local clone.",
                }),
              });

              setTimeout(function () {
                if (typeof xhr.onreadystatechange === "function") xhr.onreadystatechange();
                if (typeof xhr.onload === "function") xhr.onload();
              }, 0);
              return undefined;
            };

            return xhr;
          }

          window.XMLHttpRequest = LocalCloneXHR;
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
